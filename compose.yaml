x-control-plane-environment: &control-plane-environment
  THREADS_PLATFORM_DATABASE_URL: postgresql+asyncpg://threads_platform@postgres:5432/threads_platform
  THREADS_PLATFORM_THREADS_TOKEN_PROVIDER_MODE: disabled
  THREADS_PLATFORM_TRACING_ENABLED: "false"
  THREADS_PLATFORM_HTTP_HOST: ${THREADS_PLATFORM_HTTP_HOST:-0.0.0.0}
  THREADS_PLATFORM_HTTP_PORT: ${THREADS_PLATFORM_CONTAINER_PORT:-8000}

x-control-plane-runtime: &control-plane-runtime
  image: ${THREADS_PLATFORM_IMAGE:-threads-platform-control-plane:internal}
  build:
    context: .
    dockerfile: Dockerfile
  environment: *control-plane-environment

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: threads_platform
      POSTGRES_DB: threads_platform
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threads_platform -d threads_platform"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    <<: *control-plane-runtime
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  http:
    <<: *control-plane-runtime
    ports:
      - "127.0.0.1:${THREADS_PLATFORM_SMOKE_HTTP_PORT:-8000}:${THREADS_PLATFORM_CONTAINER_PORT:-8000}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          urllib.request.urlopen(
          f"http://127.0.0.1:{os.environ.get('THREADS_PLATFORM_HTTP_PORT', '8000')}/health",
          timeout=2).read()
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  scheduler:
    <<: *control-plane-runtime
    command: ["python", "-m", "threads_platform.scheduler"]
    environment:
      <<: *control-plane-environment
      THREADS_PLATFORM_SCHEDULER_METRICS_ENABLED: "true"
      THREADS_PLATFORM_SCHEDULER_METRICS_HOST: 0.0.0.0
      THREADS_PLATFORM_SCHEDULER_METRICS_PORT: 9101
      THREADS_PLATFORM_SCHEDULER_POLL_INTERVAL_SECONDS: ${THREADS_PLATFORM_SCHEDULER_POLL_INTERVAL_SECONDS:-15}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
