[project]
name = "threads-platform"
version = "0.1.0"
description = "A modular platform for supported Meta Threads workflows"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "cryptography>=44,<50",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy[asyncio]>=2,<3",
    "structlog>=24,<26",
    "uvicorn[standard]>=0.34,<1",
]

[build-system]
requires = ["uv_build==0.12.7"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.390,<2",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires a PostgreSQL test database"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.uv]
required-version = ">=0.12.7,<0.13"

[tool.uv.build-backend]
module-name = "threads_platform"
module-root = "src"
