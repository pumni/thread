name: Desktop Diagnostic

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact source commit to build and validate
        required: true
        type: string
      runtime_layout:
        description: Runtime layout for the reusable acceptance component
        required: false
        default: shared
        type: string
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source commit to build and validate
        type: string
        required: true
      runtime_layout:
        description: Runtime layout to verify (split is the manual fallback gate)
        type: choice
        options:
          - shared
          - split
        default: shared
        required: true

permissions:
  contents: read

env:
  DESKTOP_SOURCE_SHA: ${{ inputs.source_sha }}

jobs:
  frontend:
    if: ${{ inputs.runtime_layout == 'shared' }}
    name: Bun frontend gates (Windows x64)
    runs-on: windows-2025
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
      - name: Assert exact source revision
        shell: pwsh
        working-directory: ${{ github.workspace }}
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:SOURCE_SHA) { throw "checkout_sha_mismatch" }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v1.4.2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

  native:
    if: ${{ inputs.runtime_layout == 'shared' }}
    name: Rust and Tauri release build (Windows x64)
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
      - name: Assert exact source revision
        shell: pwsh
        working-directory: ${{ github.workspace }}
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:SOURCE_SHA) { throw "checkout_sha_mismatch" }
      - name: Parse Windows local preflight script
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $env:GITHUB_WORKSPACE "scripts/windows_local_preflight.ps1"),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "windows_local_preflight_parse_failed"
          }
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy, rustfmt
      - name: Read Rust compiler version for the cache key
        id: rust-toolchain
        shell: pwsh
        run: |
          $version = (rustc --version).Split(' ')[1]
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Cache Windows Cargo target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/desktop/src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.version }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.toml', 'apps/desktop/src-tauri/Cargo.lock') }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v1.4.2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: bun run tauri build --no-bundle -- --locked
      - name: Run Windows tray and supervisor lifecycle smoke
        shell: pwsh
        run: >-
          ../../packaging/windows_desktop/smoke_desktop_lifecycle.ps1
          -BundleExecutable "$env:GITHUB_WORKSPACE/apps/desktop/src-tauri/target/release/threads-desktop.exe"
          -ExpectedSourceRevision $env:DESKTOP_SOURCE_SHA
          -EvidencePath "$env:GITHUB_WORKSPACE/build/windows-desktop/evidence/desktop-lifecycle.json"
      - name: Upload exact-SHA Desktop lifecycle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dx02-windows-lifecycle-${{ env.DESKTOP_SOURCE_SHA }}
          path: build/windows-desktop/evidence/desktop-lifecycle.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload exact-SHA Desktop executable for Controller lifecycle smoke
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dx04-desktop-${{ env.DESKTOP_SOURCE_SHA }}
          path: apps/desktop/src-tauri/target/release/threads-desktop.exe
          if-no-files-found: error
          retention-days: 14

  windows-runtime-packaging:
    name: Windows runtime packaging and isolated smoke
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      RUNTIME_LAYOUT: ${{ inputs.runtime_layout || 'shared' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
      - name: Assert exact clean source revision
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:DESKTOP_SOURCE_SHA) { throw "checkout_sha_mismatch" }
          if (-not [Environment]::Is64BitOperatingSystem) { throw "runner_must_be_windows_x64" }
          Write-Output "DESKTOP_SOURCE_SHA=$actual"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.21
          enable-cache: true
      - name: Install locked source-quality environment
        run: uv sync --locked
      - name: Check runtime packaging sources
        run: |
          uv run --locked ruff check packaging/windows_desktop tests/unit/test_windows_desktop_evidence.py
          uv run --locked ruff format --check packaging/windows_desktop tests/unit/test_windows_desktop_evidence.py
      - name: Test runtime smoke evidence failure reporting
        run: uv run --locked pytest -q tests/unit/test_windows_desktop_evidence.py
      - name: Install locked runtime packaging dependencies
        run: uv sync --locked --no-dev --group packaging
      - name: Build pinned Windows runtime candidate
        run: uv run --locked --no-dev --group packaging python packaging/windows_desktop/build_runtime.py --layout $env:RUNTIME_LAYOUT
      - name: Verify source, dependency, license and bundle checksums
        run: >-
          uv run --locked --no-dev --group packaging python
          packaging/windows_desktop/verify_runtime_evidence.py
          --candidate-root build/windows-desktop/candidates
          --layouts $env:RUNTIME_LAYOUT
          --expected-source-revision $env:DESKTOP_SOURCE_SHA
          --uv-lock uv.lock
          --download-manifest packaging/windows_desktop/download-manifest.json
          --postgres-archive build/downloads/postgresql-17.11-4-windows-x64-binaries.zip
          --result-path build/windows-desktop/evidence/build-verification.json
      - name: Smoke selected runtime as a non-administrator
        shell: pwsh
        run: >-
          ./packaging/windows_desktop/run_hosted_smoke.ps1
          -RepositoryRoot $env:GITHUB_WORKSPACE
          -ExpectedSourceRevision $env:DESKTOP_SOURCE_SHA
          -RuntimeLayout $env:RUNTIME_LAYOUT
          -EvidenceOutput $env:GITHUB_WORKSPACE/build/windows-desktop/evidence/hosted
      - name: Upload exact-SHA runtime candidate
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dx03-candidates-${{ env.DESKTOP_SOURCE_SHA }}
          path: build/windows-desktop/candidates
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
      - name: Upload exact-SHA runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dx03-runtime-evidence-${{ env.DESKTOP_SOURCE_SHA }}
          path: build/windows-desktop/evidence
          if-no-files-found: warn
          retention-days: 14

  controller-acceptance-scenario:
    if: ${{ inputs.runtime_layout == 'shared' }}
    name: Controller scenario ${{ matrix.scenario }} (Windows x64)
    runs-on: windows-2025
    needs:
      - native
      - windows-runtime-packaging
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - bootstrap_https_cutover_tray
          - restart_renewal
          - database_crash_recovery
          - parent_crash_recovery
          - migration_recovery_auth
          - database_port_collision
          - endpoint_port_collision
          - unowned_root
          - unwritable_root
          - corrupt_cluster
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
      - name: Download exact-SHA Desktop executable
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dx04-desktop-${{ env.DESKTOP_SOURCE_SHA }}
          path: build/windows-desktop/desktop
      - name: Download exact-SHA shared runtime candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dx03-candidates-${{ env.DESKTOP_SOURCE_SHA }}
          path: build/windows-desktop/candidates
      - name: Download exact-SHA runtime smoke evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dx03-runtime-evidence-${{ env.DESKTOP_SOURCE_SHA }}
          path: build/windows-desktop/evidence
      - name: Assert exact clean source revision
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:DESKTOP_SOURCE_SHA) { throw "checkout_sha_mismatch" }
          if (-not [Environment]::Is64BitOperatingSystem) { throw "runner_must_be_windows_x64" }
          Write-Output "DESKTOP_SOURCE_SHA=$actual"
      - name: Run isolated Controller scenario as a non-administrator
        shell: pwsh
        run: >-
          ./packaging/windows_desktop/run_hosted_smoke.ps1
          -RepositoryRoot $env:GITHUB_WORKSPACE
          -ExpectedSourceRevision $env:DESKTOP_SOURCE_SHA
          -RuntimeLayout shared
          -ControllerOnly
          -EvidenceOutput $env:GITHUB_WORKSPACE/build/windows-desktop/evidence/hosted
          -ControllerDesktopExecutable "$env:GITHUB_WORKSPACE/build/windows-desktop/desktop/threads-desktop.exe"
          -ControllerScenario ${{ matrix.scenario }}
          -ControllerEvidenceOutput "$env:GITHUB_WORKSPACE/build/windows-desktop/evidence/controller-scenarios/${{ matrix.scenario }}/controller-lifecycle.json"
      - name: Ensure exact-SHA scenario evidence exists
        if: always()
        shell: pwsh
        run: |
          $evidencePath = "$env:GITHUB_WORKSPACE/build/windows-desktop/evidence/controller-scenarios/${{ matrix.scenario }}/controller-lifecycle.json"
          if (-not (Test-Path -LiteralPath $evidencePath -PathType Leaf)) {
            New-Item -ItemType Directory -Path (Split-Path -Parent $evidencePath) -Force | Out-Null
            $evidence = [ordered]@{
              schema_version = 2
              source_revision = $env:DESKTOP_SOURCE_SHA
              scenario = "${{ matrix.scenario }}"
              runner = [ordered]@{
                github_hosted = $env:GITHUB_ACTIONS -eq "true" -and $env:RUNNER_ENVIRONMENT -eq "github-hosted"
                windows_x64 = $env:RUNNER_OS -eq "Windows" -and $env:RUNNER_ARCH -eq "X64"
                non_administrator = $false
                clean_profile = $false
              }
              checks = @{}
              operator_session_timeline = @()
              operator_login_attempt_timeline = @()
              controller_runtime_identity_timeline = @()
              process_evidence = @{}
              scenario_evidence = @{}
              result = "BLOCKER"
              failure_code = "controller_scenario_harness_evidence_missing"
              failure_codes = @("controller_scenario_harness_evidence_missing")
            }
            [System.IO.File]::WriteAllText(
              $evidencePath,
              ($evidence | ConvertTo-Json -Depth 8),
              [System.Text.UTF8Encoding]::new($false)
            )
          }
      - name: Upload exact-SHA Controller scenario evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dx04-evidence-${{ env.DESKTOP_SOURCE_SHA }}-${{ matrix.scenario }}
          path: build/windows-desktop/evidence/controller-scenarios/${{ matrix.scenario }}
          if-no-files-found: warn
          retention-days: 14

  controller-acceptance:
    if: ${{ always() && inputs.runtime_layout == 'shared' }}
    name: Shared Controller acceptance join (Windows x64)
    runs-on: ubuntu-24.04
    needs:
      - controller-acceptance-scenario
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
      - name: Assert exact aggregate source revision
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$DESKTOP_SOURCE_SHA" ]]; then
            echo "checkout_sha_mismatch" >&2
            exit 1
          fi
      - name: Download every exact-SHA Controller scenario artifact
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dx04-evidence-${{ env.DESKTOP_SOURCE_SHA }}-*
          path: build/windows-desktop/scenario-artifacts
          merge-multiple: false
      - name: Validate and assemble Controller acceptance evidence
        if: always()
        run: >-
          python packaging/windows_desktop/aggregate_controller_scenarios.py
          --artifact-root build/windows-desktop/scenario-artifacts
          --source-sha ${{ env.DESKTOP_SOURCE_SHA }}
          --output-root build/windows-desktop/aggregate
      - name: Upload combined exact-SHA Controller acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dx04-evidence-${{ env.DESKTOP_SOURCE_SHA }}
          path: build/windows-desktop/aggregate
          if-no-files-found: warn
          retention-days: 14
