---
name: Secret scan

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        # actions/checkout v6.0.0
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"

          curl --fail --location --silent --show-error \
            "${base_url}/${archive}" \
            --output "${RUNNER_TEMP}/${archive}"
          curl --fail --location --silent --show-error \
            "${base_url}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" \
            --output "${RUNNER_TEMP}/gitleaks_checksums.txt"

          (
            cd "${RUNNER_TEMP}"
            grep -F " ${archive}" gitleaks_checksums.txt \
              | sha256sum --check --status
            tar -xzf "${archive}" gitleaks
          )
          "${RUNNER_TEMP}/gitleaks" version

      - name: Scan current tree with redacted output
        run: |
          "${RUNNER_TEMP}/gitleaks" dir \
            --config=.gitleaks.toml \
            --redact \
            --no-banner .

      - name: Scan newly introduced commits with redacted output
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          SCAN_BASE_SHA: >-
            ${{ github.event.pull_request.base.sha ||
            github.event.before }}
          SCAN_HEAD_SHA: >-
            ${{ github.event.pull_request.head.sha ||
            github.sha }}
        run: |
          if [[ ! "${SCAN_BASE_SHA}" =~ ^[0-9a-f]{40}$ ]] \
            || [[ ! "${SCAN_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve the scan commit range" >&2
            exit 1
          fi
          git cat-file -e "${SCAN_BASE_SHA}^{commit}"
          git cat-file -e "${SCAN_HEAD_SHA}^{commit}"
          scan_range="${SCAN_BASE_SHA}..${SCAN_HEAD_SHA}"
          scan_log_opts="${scan_range} --diff-filter=ACMRT"
          "${RUNNER_TEMP}/gitleaks" git \
            --config=.gitleaks.toml \
            --redact \
            --no-banner \
            --log-opts="${scan_log_opts}" .
