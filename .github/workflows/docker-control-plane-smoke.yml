name: Docker Control Plane Component

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact source commit to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  compose-restart-smoke:
    name: Exact-head Docker and PostgreSQL restart smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      THREADS_PLATFORM_SMOKE_PROJECT_NAME: threads-cp-smoke-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_PROJECT_NAME: threads-cp-smoke-${{ github.run_id }}-${{ github.run_attempt }}
      THREADS_PLATFORM_IMAGE: threads-control-plane:smoke-${{ github.run_id }}-${{ github.run_attempt }}
      THREADS_PLATFORM_SMOKE_HTTP_PORT: "18000"
    steps:
      - name: Check out exact source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Assert exact source revision
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$SOURCE_SHA" ]]; then
            echo "checkout_sha_mismatch: expected $SOURCE_SHA, got $actual" >&2
            exit 1
          fi

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"

      - name: Install locked smoke environment
        run: uv sync --locked

      - name: Build image and run Compose restart/recovery smoke
        run: uv run --locked python scripts/control_plane_compose_smoke.py

      - name: Remove smoke containers and PostgreSQL volume
        if: always()
        run: docker compose --profile tls-admin down --volumes --remove-orphans
