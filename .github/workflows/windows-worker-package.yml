name: Windows Worker package

on:
  pull_request:
    paths:
      - ".github/workflows/windows-worker-package.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "packaging/windows_worker/**"
      - "src/threads_platform/workers/**"
      - "src/threads_platform/infrastructure/worker_agent/**"
      - "src/threads_platform/infrastructure/browser/**"
      - "tests/unit/test_worker_package.py"
      - "README.md"
      - "docs/ARCHITECTURE.md"
      - "docs/PROJECT_STATE_HANDOFF.md"
      - "docs/WORKER_AGENT_WINDOWS.md"
      - "docs/WORKER_UPDATE_RUNBOOK.md"
      - "docs/WORK_BREAKDOWN.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows-worker-package.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "packaging/windows_worker/**"
      - "src/threads_platform/workers/**"
      - "src/threads_platform/infrastructure/worker_agent/**"
      - "src/threads_platform/infrastructure/browser/**"
      - "tests/unit/test_worker_package.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Windows x64 Worker package and smoke
    runs-on: windows-latest
    env:
      PYTHONHASHSEED: "1"
    steps:
      - name: Check out exact source without persisted credentials
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --group packaging

      - name: Install only locked Playwright Chromium
        shell: pwsh
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"
        run: uv run --locked playwright install chromium

      - name: Set stable PE build timestamp
        shell: pwsh
        run: |
          $commitEpoch = (git show -s --format=%ct HEAD).Trim()
          if ($commitEpoch -notmatch '^\d+$') { throw 'Git build timestamp is unavailable' }
          "SOURCE_DATE_EPOCH=$commitEpoch" >> $env:GITHUB_ENV

      - name: Build PyInstaller onedir bundle
        shell: pwsh
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"
          PYTHONHASHSEED: "1"
        run: >-
          uv run --locked pyinstaller --clean --noconfirm
          --distpath "$env:RUNNER_TEMP\worker-dist"
          --workpath "$env:RUNNER_TEMP\worker-pyinstaller-work"
          packaging/windows_worker/threads-worker.spec

      - name: Stage bundle and safe manifest
        shell: pwsh
        run: >-
          uv run --locked python packaging/windows_worker/build_package.py stage
          --dist-root "$env:RUNNER_TEMP\worker-dist"
          --output-root "$env:RUNNER_TEMP\worker-stage"

      - name: Run packaged executable smoke checks
        shell: pwsh
        run: |
          $packageRoot = Join-Path $env:RUNNER_TEMP 'worker-stage\threads-worker-windows-x64'
          $executable = Join-Path $packageRoot 'threads-worker.exe'
          $manifestPath = Join-Path $packageRoot 'BUILD-MANIFEST.json'
          if (!(Test-Path -LiteralPath $executable) -or !(Test-Path -LiteralPath $manifestPath)) {
            throw 'Packaged executable or manifest is missing'
          }
          $manifest = Get-Content -Raw -LiteralPath $manifestPath | ConvertFrom-Json
          $expectedFields = @(
            'artifact_schema', 'project_version', 'git_sha', 'python_version',
            'playwright_version', 'pyinstaller_version', 'target_os', 'target_arch',
            'browser', 'created_at_utc'
          ) | Sort-Object
          $actualFields = @($manifest.PSObject.Properties.Name | Sort-Object)
          if (Compare-Object $expectedFields $actualFields) { throw 'Manifest fields are invalid' }
          if ($manifest.git_sha -ne (git rev-parse HEAD).Trim()) {
            throw 'Manifest Git SHA does not match the checked-out source'
          }
          if ($manifest.target_os -ne 'windows' -or $manifest.target_arch -ne 'x64' -or
              $manifest.browser -ne 'chromium') {
            throw 'Manifest target does not match the package'
          }

          $versionOutput = (& $executable --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $versionOutput -ne $manifest.project_version) {
            throw 'Packaged --version check failed'
          }
          $configuredDataRoot = Join-Path $env:RUNNER_TEMP 'configured-worker-data'
          New-Item -ItemType Directory -Path $configuredDataRoot | Out-Null
          $sentinelPath = Join-Path $configuredDataRoot 'operator-data-sentinel.txt'
          Set-Content -NoNewline -LiteralPath $sentinelPath -Value 'preserve'
          $beforeDataPaths = @(
            Get-ChildItem -Force -Recurse -LiteralPath $configuredDataRoot |
              ForEach-Object { $_.FullName } | Sort-Object
          )
          $env:THREADS_WORKER_DATA_ROOT = $configuredDataRoot
          $packageCheckOutput = (& $executable --package-check).Trim()
          if ($LASTEXITCODE -ne 0 -or $packageCheckOutput -ne 'WORKER_PACKAGE_CHECK_OK') {
            throw 'Packaged --package-check failed'
          }
          $afterDataPaths = @(
            Get-ChildItem -Force -Recurse -LiteralPath $configuredDataRoot |
              ForEach-Object { $_.FullName } | Sort-Object
          )
          if (Compare-Object $beforeDataPaths $afterDataPaths) {
            throw 'Package check modified the configured Worker data root'
          }
          if ((Get-Content -Raw -LiteralPath $sentinelPath) -ne 'preserve') {
            throw 'Package check changed existing Worker data'
          }

          Remove-Item Env:THREADS_WORKER_CONTROL_PLANE_URL -ErrorAction SilentlyContinue
          Remove-Item Env:THREADS_WORKER_DATA_ROOT -ErrorAction SilentlyContinue
          $normalOutput = (& $executable 2>&1 | Out-String).Trim()
          $normalExitCode = $LASTEXITCODE
          if ($normalExitCode -eq 0 -or $normalOutput -notmatch 'THREADS_WORKER_CONFIGURATION_INVALID') {
            throw 'Normal startup without Control Plane configuration did not fail safely'
          }
          $serviceCheckOutput = (& $executable --windows-service-check 2>&1 | Out-String).Trim()
          $serviceCheckExitCode = $LASTEXITCODE
          if ($serviceCheckExitCode -ne 2 -or $serviceCheckOutput -notmatch 'THREADS_WORKER_SERVICE_REQUIRES_SCM') {
            throw 'SCM diagnostic mode accepted a normal process launch'
          }
          Write-Output "PACKAGED_VERSION_OK $versionOutput"
          Write-Output 'PACKAGED_RUNTIME_CHECK_OK'
          Write-Output 'SERVICE_CHECK_REQUIRES_SCM_OK'
          Write-Output 'MISSING_CONTROL_PLANE_CONFIG_FAILS_CLOSED'
          exit 0

      - name: Create deterministic ZIP and SHA-256
        shell: pwsh
        run: >-
          uv run --locked python packaging/windows_worker/build_package.py archive
          --package-root "$env:RUNNER_TEMP\worker-stage\threads-worker-windows-x64"
          --output-root "$env:RUNNER_TEMP\worker-release"

      - name: Install and verify real LocalService SCM lifecycle
        shell: pwsh
        run: |
          $packageRoot = Join-Path $env:RUNNER_TEMP 'worker-stage\threads-worker-windows-x64'
          $releaseDirectory = Join-Path $env:ProgramFiles ('ThreadsWorker\releases\' + (git rev-parse HEAD).Trim())
          if (Test-Path -LiteralPath $releaseDirectory) { throw 'Immutable release path already exists' }
          New-Item -ItemType Directory -Path $releaseDirectory -Force | Out-Null
          Copy-Item -Path (Join-Path $packageRoot '*') -Destination $releaseDirectory -Recurse -Force

          $packageAcl = Get-Acl -LiteralPath $releaseDirectory
          foreach ($rule in $packageAcl.Access) {
            $ruleSid = $rule.IdentityReference.Translate([Security.Principal.SecurityIdentifier]).Value
            if ($ruleSid -eq 'S-1-5-19' -and $rule.AccessControlType -eq 'Allow' -and
                $rule.FileSystemRights.ToString() -match 'Write|Modify|FullControl|Delete') {
              throw 'LocalService can write the immutable release package'
            }
          }

          $installer = Join-Path $env:GITHUB_WORKSPACE 'packaging\windows_worker\Install-ThreadsWorkerService.ps1'
          & $installer -ReleaseDirectory $releaseDirectory -WindowsServiceCheck
          if ($LASTEXITCODE -ne 0) { throw 'SCM service-check installation failed' }
          $serviceName = 'ThreadsOperationsWorker'
          $serviceRegistryPath = "HKLM:\SYSTEM\CurrentControlSet\Services\$serviceName"
          $serviceEnvironment = @((Get-ItemProperty -LiteralPath $serviceRegistryPath -Name Environment).Environment)
          if ($serviceEnvironment.Count -ne 1 -or
              $serviceEnvironment[0] -notmatch '^THREADS_WORKER_SERVICE_CHECK_ROOT=') {
            throw 'SCM service environment contains unexpected or secret-capable entries'
          }
          $serviceDataRoot = $serviceEnvironment[0].Substring('THREADS_WORKER_SERVICE_CHECK_ROOT='.Length)
          if (!(Test-Path -LiteralPath $serviceDataRoot -PathType Container)) {
            throw 'Isolated LocalService data root was not created'
          }

          $dataAcl = Get-Acl -LiteralPath $serviceDataRoot
          if (!$dataAcl.AreAccessRulesProtected) { throw 'Service data ACL still inherits broad parent access' }
          $rulesBySid = @{}
          foreach ($rule in $dataAcl.Access) {
            $sid = $rule.IdentityReference.Translate([Security.Principal.SecurityIdentifier]).Value
            if (!$rulesBySid.ContainsKey($sid)) { $rulesBySid[$sid] = @() }
            $rulesBySid[$sid] += $rule
          }
          $allowedSids = @('S-1-5-19', 'S-1-5-18', 'S-1-5-32-544')
          if (Compare-Object @($rulesBySid.Keys | Sort-Object) @($allowedSids | Sort-Object)) {
            throw 'Service data ACL contains a broad or missing principal'
          }
          foreach ($sid in $allowedSids) {
            if (!$rulesBySid.ContainsKey($sid)) { throw 'A required service data ACL principal is missing' }
          }
          $localServiceRights = ($rulesBySid['S-1-5-19'] | ForEach-Object { $_.FileSystemRights.ToString() }) -join ';'
          $systemRights = ($rulesBySid['S-1-5-18'] | ForEach-Object { $_.FileSystemRights.ToString() }) -join ';'
          $adminRights = ($rulesBySid['S-1-5-32-544'] | ForEach-Object { $_.FileSystemRights.ToString() }) -join ';'
          if ($localServiceRights -notmatch 'Modify' -or $systemRights -notmatch 'FullControl' -or
              $adminRights -notmatch 'FullControl') {
            throw 'Service data ACL grants do not match the required service contract'
          }

          $service = Get-CimInstance Win32_Service -Filter "Name='$serviceName'"
          if ($service.StartName -ne 'NT AUTHORITY\LocalService') {
            throw 'SCM service is not installed under LocalService'
          }
          if ($service.PathName -notmatch [regex]::Escape('"' + (Join-Path $releaseDirectory 'threads-worker.exe') + '" --windows-service-check')) {
            throw 'SCM ImagePath does not point to the immutable packaged service-check mode'
          }
          if ($serviceEnvironment -match 'ENROLLMENT|TOKEN|SECRET|PASSWORD|PRIVATE_KEY') {
            throw 'SCM service environment contains a forbidden secret setting'
          }

          $serviceKey = [Microsoft.Win32.Registry]::LocalMachine.OpenSubKey(
            "SYSTEM\CurrentControlSet\Services\$serviceName", $true
          )
          try {
            $imagePath = [string] $serviceKey.GetValue('ImagePath', '')
            if ($imagePath -notmatch '(?i)threads-worker\.exe" --windows-service-check$') {
              throw 'SCM registry ImagePath is not service-check mode'
            }
          } finally { $serviceKey.Dispose() }

          function Wait-WorkerServiceState([string] $ExpectedState) {
            $deadline = [DateTime]::UtcNow.AddMinutes(2)
            do {
              $current = Get-Service -Name $serviceName
              if ($current.Status.ToString() -eq $ExpectedState) { return }
              Start-Sleep -Seconds 1
            } while ([DateTime]::UtcNow -lt $deadline)
            throw "SCM service did not reach $ExpectedState"
          }

          & sc.exe start $serviceName | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'SCM service start failed' }
          Wait-WorkerServiceState 'Running'
          $identityPath = Join-Path $serviceDataRoot 'worker\worker_id'
          $workerId = (Get-Content -LiteralPath $identityPath | Select-Object -First 1).Trim()
          if ($workerId -notmatch '^[0-9a-fA-F-]{36}$') { throw 'LocalService identity was not created' }
          $keyPath = Join-Path $serviceDataRoot ('worker\' + $workerId + '.device-key.dpapi')
          $journalPath = Join-Path $serviceDataRoot 'journal\worker-state.sqlite3'
          if (!(Test-Path -LiteralPath $keyPath -PathType Leaf) -or
              !(Test-Path -LiteralPath $journalPath -PathType Leaf)) {
            throw 'LocalService DPAPI key or local journal was not created'
          }
          $identityHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $identityPath).Hash
          $keyHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $keyPath).Hash

          & sc.exe stop $serviceName | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'SCM service stop request failed' }
          Wait-WorkerServiceState 'Stopped'
          & sc.exe start $serviceName | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'SCM service restart failed' }
          Wait-WorkerServiceState 'Running'
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $identityPath).Hash -ne $identityHash -or
              (Get-FileHash -Algorithm SHA256 -LiteralPath $keyPath).Hash -ne $keyHash) {
            throw 'LocalService identity or DPAPI key changed across restart'
          }

          $uninstaller = Join-Path $env:GITHUB_WORKSPACE 'packaging\windows_worker\Uninstall-ThreadsWorkerService.ps1'
          & $uninstaller -StopWaitSeconds 120
          if ($LASTEXITCODE -ne 0) { throw 'SCM service uninstall failed' }
          $deleteDeadline = [DateTime]::UtcNow.AddSeconds(30)
          do {
            $remainingService = Get-Service -Name $serviceName -ErrorAction SilentlyContinue
            if (!$remainingService) { break }
            Start-Sleep -Seconds 1
          } while ([DateTime]::UtcNow -lt $deleteDeadline)
          if ($remainingService) { throw 'SCM service remains registered after uninstall' }
          if (!(Test-Path -LiteralPath $identityPath) -or !(Test-Path -LiteralPath $keyPath) -or
              !(Test-Path -LiteralPath $journalPath)) {
            throw 'Service uninstall deleted durable Worker data'
          }
          Write-Output 'WINDOWS_REAL_SCM_LOCALSERVICE_OK'

      - name: Verify archive digest
        shell: pwsh
        run: |
          $releaseRoot = Join-Path $env:RUNNER_TEMP 'worker-release'
          $archive = Get-ChildItem -LiteralPath $releaseRoot -Filter '*.zip' | Select-Object -First 1
          $digestFile = Join-Path $releaseRoot ($archive.Name + '.sha256')
          $expectedDigest = (Get-Content -Raw -LiteralPath $digestFile).Split(' ')[0]
          $actualDigest = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive.FullName).Hash.ToLowerInvariant()
          if ($actualDigest -ne $expectedDigest) { throw 'ZIP SHA-256 verification failed' }
          Write-Output "VERIFIED_SHA256 $actualDigest"

      - name: Upload unsigned internal/test artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-worker-package-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/worker-release/*.zip
            ${{ runner.temp }}/worker-release/*.zip.sha256
            ${{ runner.temp }}/worker-release/BUILD-MANIFEST.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
