name: PR Acceptance

on:
  pull_request:
    types: [ready_for_review]

permissions:
  actions: read
  contents: read

concurrency:
  group: pr-acceptance-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preflight-evidence:
    name: Verify latest exact-head cheap gates
    runs-on: ubuntu-24.04
    steps:
      - name: Require latest Secret scan and PR Head Guard success
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          for workflow_spec in "secret-scan.yml|Secret scan" "pr-head-guard.yml|PR Head Guard"; do
            workflow="${workflow_spec%%|*}"
            workflow_name="${workflow_spec#*|}"
            endpoint="repos/${REPOSITORY}/actions/workflows/${workflow}/runs?head_sha=${SOURCE_SHA}&event=pull_request&per_page=100"
            pages="$(gh api --paginate "$endpoint")"
            latest="$(jq -s --arg sha "$SOURCE_SHA" --arg name "$workflow_name" --argjson pr "$PR_NUMBER" \
              '[.[] | .workflow_runs[]? | select(.head_sha == $sha and .event == "pull_request" and .name == $name and any(.pull_requests[]?; .number == $pr))] | sort_by([.created_at, .id]) | last // empty' \
              <<<"$pages")"

            if [[ -z "$latest" ]]; then
              echo "missing_latest_exact_head_run: ${workflow} pr=${PR_NUMBER} ${SOURCE_SHA}" >&2
              exit 1
            fi
            run_id="$(jq -r '.id' <<<"$latest")"
            status="$(jq -r '.status' <<<"$latest")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$latest")"
            if [[ "$status" != "completed" || "$conclusion" != "success" ]]; then
              echo "latest_exact_head_run_not_successful: ${workflow} pr=${PR_NUMBER} run=${run_id} status=${status} conclusion=${conclusion}" >&2
              exit 1
            fi
            echo "accepted_exact_head_evidence workflow=${workflow} pr=${PR_NUMBER} run=${run_id} sha=${SOURCE_SHA}"
          done

  changes:
    name: Classify Worker and Desktop paths
    needs: preflight-evidence
    runs-on: ubuntu-24.04
    outputs:
      worker: ${{ steps.classify.outputs.worker }}
      desktop: ${{ steps.classify.outputs.desktop }}
    steps:
      - name: Check out exact PR head and full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Classify Worker and Desktop relevance
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/ci_changed_paths.py \
            --mode pull_request \
            --base-sha "$BASE_SHA" \
            --head-sha "$SOURCE_SHA"

  python-quality:
    name: Python Quality Component
    needs: preflight-evidence
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ github.event.pull_request.head.sha }}
    permissions:
      contents: read

  docker-control-plane:
    name: Docker Control Plane Component
    needs: preflight-evidence
    uses: ./.github/workflows/docker-control-plane-smoke.yml
    with:
      source_sha: ${{ github.event.pull_request.head.sha }}
    permissions:
      contents: read

  desktop:
    name: Desktop Diagnostic Component
    needs:
      - preflight-evidence
      - changes
    if: ${{ needs.changes.outputs.desktop == 'true' }}
    uses: ./.github/workflows/desktop.yml
    with:
      source_sha: ${{ github.event.pull_request.head.sha }}
      runtime_layout: shared
    permissions:
      contents: read

  worker-package:
    name: Windows Worker Package Component
    needs:
      - preflight-evidence
      - changes
    if: ${{ needs.changes.outputs.worker == 'true' }}
    uses: ./.github/workflows/windows-worker-package.yml
    with:
      source_sha: ${{ github.event.pull_request.head.sha }}
    permissions:
      contents: read

  worker-desktop:
    name: Worker Desktop Acceptance Component
    needs:
      - changes
      - desktop
      - worker-package
    if: ${{ needs.changes.outputs.worker == 'true' && needs.desktop.result == 'success' && needs.worker-package.result == 'success' }}
    uses: ./.github/workflows/worker-desktop-acceptance.yml
    with:
      source_sha: ${{ github.event.pull_request.head.sha }}
    permissions:
      contents: read

  acceptance-gate:
    name: PR Acceptance
    if: always()
    needs:
      - preflight-evidence
      - changes
      - python-quality
      - docker-control-plane
      - desktop
      - worker-package
      - worker-desktop
    runs-on: ubuntu-24.04
    steps:
      - name: Require a complete exact-head acceptance set
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          PREFLIGHT_RESULT: ${{ needs.preflight-evidence.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          WORKER_NEEDED: ${{ needs.changes.outputs.worker }}
          DESKTOP_NEEDED: ${{ needs.changes.outputs.desktop }}
          PYTHON_RESULT: ${{ needs.python-quality.result }}
          DOCKER_RESULT: ${{ needs.docker-control-plane.result }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          WORKER_RESULT: ${{ needs.worker-package.result }}
          WORKER_DESKTOP_RESULT: ${{ needs.worker-desktop.result }}
        run: |
          set -euo pipefail
          printf 'source_sha=%s\npreflight=%s\nchanges=%s\npython=%s\ndocker=%s\ndesktop_needed=%s\ndesktop=%s\nworker_needed=%s\nworker=%s\nworker_desktop=%s\n' \
            "$SOURCE_SHA" "$PREFLIGHT_RESULT" "$CHANGES_RESULT" \
            "$PYTHON_RESULT" "$DOCKER_RESULT" "$DESKTOP_NEEDED" \
            "$DESKTOP_RESULT" "$WORKER_NEEDED" "$WORKER_RESULT" \
            "$WORKER_DESKTOP_RESULT"

          for result in "$PREFLIGHT_RESULT" "$CHANGES_RESULT" "$PYTHON_RESULT" "$DOCKER_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "required_acceptance_component_not_successful: $result" >&2
              exit 1
            fi
          done
          if [[ "$DESKTOP_NEEDED" == "true" ]]; then
            [[ "$DESKTOP_RESULT" == "success" ]] || {
              echo "desktop_component_required_but_not_successful: $DESKTOP_RESULT" >&2
              exit 1
            }
          elif [[ "$DESKTOP_NEEDED" == "false" ]]; then
            [[ "$DESKTOP_RESULT" == "skipped" ]] || {
              echo "desktop_component_should_be_skipped: $DESKTOP_RESULT" >&2
              exit 1
            }
          else
            echo "invalid_desktop_requirement: $DESKTOP_NEEDED" >&2
            exit 1
          fi
          if [[ "$WORKER_NEEDED" == "true" ]]; then
            [[ "$WORKER_RESULT" == "success" ]] || {
              echo "worker_component_required_but_not_successful: $WORKER_RESULT" >&2
              exit 1
            }
            [[ "$WORKER_DESKTOP_RESULT" == "success" ]] || {
              echo "worker_desktop_component_required_but_not_successful: $WORKER_DESKTOP_RESULT" >&2
              exit 1
            }
          elif [[ "$WORKER_RESULT" != "skipped" || "$WORKER_DESKTOP_RESULT" != "skipped" ]]; then
            echo "worker_components_should_be_skipped: package=$WORKER_RESULT desktop=$WORKER_DESKTOP_RESULT" >&2
            exit 1
          fi
