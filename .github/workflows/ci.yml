name: Python Quality Component

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact source commit to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  quality:
    name: Python 3.14 quality gate
    runs-on: ubuntu-24.04
    env:
      THREADS_PLATFORM_DATABASE_URL: postgresql+asyncpg://threads_platform@localhost:5432/threads_platform_test
      THREADS_PLATFORM_TEST_DATABASE_URL: postgresql+asyncpg://threads_platform@localhost:5432/threads_platform_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: threads_platform
          POSTGRES_DB: threads_platform_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U threads_platform -d threads_platform_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out exact source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Assert exact source revision
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$SOURCE_SHA" ]]; then
            echo "checkout_sha_mismatch: expected $SOURCE_SHA, got $actual" >&2
            exit 1
          fi

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Report locked dependency tree
        run: uv tree --locked --all-groups

      - name: Install locked Playwright Chromium
        run: uv run --locked playwright install --with-deps chromium

      - name: Check lint
        run: uv run --locked ruff check .

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Check types
        run: uv run --locked pyright

      - name: Apply migrations to empty PostgreSQL database
        run: uv run --locked alembic upgrade head

      - name: Check migration metadata
        run: uv run --locked alembic check

      - name: Repeat WorkerJob route-claim race on PostgreSQL 17
        shell: bash
        run: |
          for attempt in {1..10}; do
            echo "WorkerJob route-claim race run ${attempt}/10"
            uv run --locked pytest -q tests/integration/test_worker_job_cancellation.py::test_low_and_normal_do_not_preempt_and_high_arrival_races_claim_safely
          done

      - name: Run tests
        run: uv run --locked pytest -ra
