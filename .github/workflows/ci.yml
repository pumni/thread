name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Python 3.14 quality gate
    runs-on: ubuntu-latest
    env:
      THREADS_PLATFORM_DATABASE_URL: postgresql+asyncpg://threads_platform@localhost:5432/threads_platform_test
      THREADS_PLATFORM_TEST_DATABASE_URL: postgresql+asyncpg://threads_platform@localhost:5432/threads_platform_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: threads_platform
          POSTGRES_DB: threads_platform_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U threads_platform -d threads_platform_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out source
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Check lint
        run: uv run --locked ruff check .

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Check types
        run: uv run --locked pyright

      - name: Apply migrations to empty PostgreSQL database
        run: uv run --locked alembic upgrade head

      - name: Check migration metadata
        run: uv run --locked alembic check

      - name: Run tests
        run: uv run --locked pytest
